<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ROMA Cafe Inventory Management System">
<title>ROMA Cafe | Inventory Management System</title>

<style>
:root{
  --brown:#795338;
  --brown-dark:#5f3f2a;
  --brown-light:#967054;
  --cream:#f7f2ed;
  --cream-dark:#eee5dd;
  --white:#fff;
  --navy:#132238;
  --text:#263238;
  --muted:#718096;
  --border:#e5ddd5;
  --green:#2e7d32;
  --green-bg:#e9f6eb;
  --red:#c62828;
  --red-bg:#fdecec;
  --orange:#ef8a17;
  --orange-bg:#fff3df;
  --shadow:0 12px 30px rgba(51,38,27,.08);
  --radius:16px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:var(--cream);
  color:var(--text);
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =====================================================
   AUTH
===================================================== */

.auth-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:linear-gradient(135deg,#68462f,#896044);
}

.login-card{
  width:100%;
  max-width:525px;
  background:var(--white);
  border-radius:30px;
  padding:44px;
  box-shadow:0 30px 70px rgba(0,0,0,.18);
}

.brand-logo{
  width:72px;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:var(--brown);
  color:white;
  font-family:Georgia,serif;
  font-size:34px;
  font-weight:bold;
  margin-bottom:28px;
}

.login-card h1{
  font-size:40px;
  color:var(--navy);
  margin-bottom:6px;
}

.login-subtitle{
  color:var(--muted);
  font-size:18px;
  margin-bottom:36px;
}

.form-group{
  margin-bottom:20px;
}

.form-group label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin-bottom:8px;
}

.form-control{
  width:100%;
  border:1px solid var(--border);
  background:white;
  border-radius:12px;
  padding:15px 16px;
  outline:none;
  transition:.2s;
}

.form-control:focus{
  border-color:var(--brown);
  box-shadow:0 0 0 3px rgba(121,83,56,.12);
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--brown);
  color:white;
}

.btn-primary:hover{
  background:var(--brown-dark);
}

.btn-secondary{
  background:var(--cream-dark);
  color:var(--brown-dark);
}

.btn-danger{
  background:var(--red);
  color:white;
}

.btn-success{
  background:var(--green);
  color:white;
}

.btn-full{
  width:100%;
  padding:16px;
  font-size:17px;
}

.otp-info{
  background:var(--cream);
  border-radius:12px;
  padding:15px;
  margin-bottom:20px;
  font-size:14px;
  color:var(--muted);
}

.back-login{
  width:100%;
  background:transparent;
  border:0;
  margin-top:12px;
  color:var(--brown);
  font-weight:700;
}

/* =====================================================
   APP LAYOUT
===================================================== */

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:255px;
  background:#fff;
  border-right:1px solid var(--border);
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  display:flex;
  flex-direction:column;
  z-index:100;
}

.sidebar-brand{
  padding:25px 22px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--border);
}

.sidebar-logo{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--brown);
  color:white;
  border-radius:12px;
  font-family:Georgia,serif;
  font-size:22px;
  font-weight:bold;
}

.sidebar-brand-text strong{
  display:block;
  font-size:17px;
  color:var(--navy);
}

.sidebar-brand-text span{
  font-size:12px;
  color:var(--muted);
}

.nav{
  padding:20px 12px;
  flex:1;
  overflow-y:auto;
}

.nav-section{
  font-size:11px;
  font-weight:800;
  color:#9b8d82;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:8px 12px;
  margin-bottom:6px;
}

.nav-item{
  width:100%;
  border:0;
  background:transparent;
  color:#6b625d;
  padding:13px 14px;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:4px;
  text-align:left;
  font-weight:600;
  transition:.2s;
}

.nav-item:hover{
  background:var(--cream);
  color:var(--brown);
}

.nav-item.active{
  background:#f0e7df;
  color:var(--brown);
  font-weight:800;
}

.nav-icon{
  width:22px;
  min-width:22px;
  text-align:center;
  font-size:17px;
}

.sidebar-user{
  padding:18px;
  border-top:1px solid var(--border);
}

.user-name{
  font-weight:800;
  color:var(--navy);
}

.user-role{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.logout-btn{
  width:100%;
  margin-top:12px;
}

/* =====================================================
   MAIN
===================================================== */

.main{
  margin-left:255px;
  width:calc(100% - 255px);
  min-height:100vh;
}

.topbar{
  height:78px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  position:sticky;
  top:0;
  z-index:50;
}

.topbar-title h2{
  color:var(--navy);
  font-size:22px;
}

.topbar-title p{
  color:var(--muted);
  font-size:13px;
  margin-top:2px;
}

.content{
  padding:30px;
}

/* =====================================================
   MOBILE HEADER
===================================================== */

.mobile-header{
  display:none;
}

/* =====================================================
   CARDS
===================================================== */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
  margin-bottom:25px;
}

.stat-card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:var(--shadow);
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.stat-value{
  color:var(--navy);
  font-size:30px;
  font-weight:800;
  margin-top:8px;
}

.stat-description{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

/* =====================================================
   PAGE HEADER
===================================================== */

.page-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:22px;
}

.page-header h3{
  color:var(--navy);
  font-size:24px;
}

.page-header p{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.page-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

/* =====================================================
   PANELS
===================================================== */

.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.panel-header{
  padding:19px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.panel-header h4{
  color:var(--navy);
  font-size:17px;
}

.panel-body{
  padding:22px;
}

/* =====================================================
   TABLE
===================================================== */

.table-wrapper{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th{
  text-align:left;
  background:#faf8f6;
  color:#776b62;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.5px;
  padding:13px 15px;
  border-bottom:1px solid var(--border);
}

td{
  padding:15px;
  border-bottom:1px solid #eee8e3;
  font-size:14px;
}

tr:last-child td{
  border-bottom:0;
}

.item-name{
  font-weight:800;
  color:var(--navy);
}

.muted{
  color:var(--muted);
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:5px 10px;
  font-size:11px;
  font-weight:800;
}

.badge-green{
  background:var(--green-bg);
  color:var(--green);
}

.badge-red{
  background:var(--red-bg);
  color:var(--red);
}

.badge-orange{
  background:var(--orange-bg);
  color:var(--orange);
}

.badge-brown{
  background:#f1e8e0;
  color:var(--brown-dark);
}

/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.search-box{
  flex:1;
  min-width:220px;
}

.search-box input{
  width:100%;
}

/* =====================================================
   GRID
===================================================== */

.two-column{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:22px;
}

.three-column{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.empty strong{
  display:block;
  color:var(--navy);
  margin-bottom:5px;
}

/* =====================================================
   MODAL
===================================================== */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(18,23,28,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.modal{
  width:100%;
  max-width:600px;
  background:white;
  border-radius:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.25);
  max-height:90vh;
  overflow-y:auto;
}

.modal-header{
  padding:20px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-header h3{
  color:var(--navy);
}

.close-btn{
  width:35px;
  height:35px;
  border:0;
  border-radius:9px;
  background:var(--cream);
  color:var(--brown);
  font-size:20px;
}

.modal-body{
  padding:22px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.full{
  grid-column:1/-1;
}

.modal-footer{
  padding:18px 22px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

/* =====================================================
   REPORT
===================================================== */

.report-card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
}

.report-card h4{
  color:var(--navy);
  margin-bottom:10px;
}

.report-number{
  font-size:28px;
  font-weight:800;
  color:var(--brown);
}

.progress{
  width:100%;
  height:8px;
  background:#eee8e3;
  border-radius:99px;
  overflow:hidden;
  margin-top:12px;
}

.progress-bar{
  height:100%;
  background:var(--brown);
  border-radius:inherit;
}

/* =====================================================
   LOADING
===================================================== */

.loading{
  padding:50px;
  text-align:center;
  color:var(--muted);
}

.spinner{
  width:30px;
  height:30px;
  border:3px solid #eadfd5;
  border-top-color:var(--brown);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  max-width:360px;
  background:white;
  border:1px solid var(--border);
  border-left:5px solid var(--brown);
  border-radius:12px;
  padding:15px 18px;
  box-shadow:0 15px 40px rgba(0,0,0,.15);
  z-index:1000;
  animation:toastIn .25s ease;
}

.toast.error{
  border-left-color:var(--red);
}

.toast.success{
  border-left-color:var(--green);
}

@keyframes toastIn{
  from{
    transform:translateY(20px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

/* =====================================================
   TABLET
===================================================== */

@media(max-width:1100px){
  .stats-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

/* =====================================================
   MOBILE BOTTOM NAVIGATION
===================================================== */

@media(max-width:800px){

  body{
    padding-bottom:78px;
  }

  .sidebar{
    position:fixed;
    left:0;
    right:0;
    top:auto;
    bottom:0;

    width:100%;
    height:72px;

    border-right:0;
    border-top:1px solid var(--border);

    background:rgba(255,255,255,.98);

    box-shadow:
      0 -5px 25px rgba(51,38,27,.12);

    display:block;

    z-index:900;

    transform:none!important;
  }

  /*
   * Hide the desktop sidebar branding and account area.
   * The navigation itself becomes the bottom menu.
   */

  .sidebar-brand,
  .sidebar-user{
    display:none;
  }

  .nav{
    height:100%;
    width:100%;
    padding:5px 3px 4px;

    display:grid;
    grid-template-columns:repeat(7,1fr);

    gap:0;

    overflow:hidden;
  }

  .nav-section{
    display:none;
  }

  .nav-item{
    width:100%;
    height:100%;

    padding:5px 1px;

    margin:0;

    border-radius:9px;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:3px;

    text-align:center;

    font-size:9px;
    font-weight:600;

    color:#81776f;
  }

  .nav-item:hover{
    background:transparent;
    color:var(--brown);
  }

  .nav-item.active{
    background:#f0e7df;
    color:var(--brown);
    font-weight:800;
  }

  .nav-icon{
    width:auto;
    min-width:0;

    height:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;
    line-height:1;
  }

  .nav-item span:last-child{
    white-space:nowrap;
    line-height:11px;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  /*
   * Mobile top header.
   * No hamburger button because the navigation is now at
   * the bottom of the screen.
   */

  .mobile-header{
    display:flex;

    position:sticky;
    top:0;

    z-index:80;

    height:60px;

    background:white;

    border-bottom:1px solid var(--border);

    align-items:center;
    justify-content:center;

    padding:0 17px;
  }

  .mobile-brand{
    font-weight:900;
    color:var(--navy);
    font-size:18px;
  }

  .topbar{
    display:none;
  }

  .content{
    padding:20px 15px 30px;
  }

  .two-column{
    grid-template-columns:1fr;
  }

  .three-column{
    grid-template-columns:1fr;
  }

  .page-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .login-card{
    padding:30px 24px;
    border-radius:22px;
  }

  .login-card h1{
    font-size:32px;
  }
}

/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:560px){

  .stats-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-card{
    padding:14px 12px;
  }

  .stat-value{
    font-size:23px;
  }

  .stat-label{
    font-size:11px;
  }

  .stat-description{
    font-size:10px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .page-actions{
    width:100%;
  }

  .page-actions .btn{
    flex:1;
  }

  .panel-body{
    padding:16px;
  }

  .modal-footer{
    flex-direction:column;
  }

  .modal-footer .btn{
    width:100%;
  }

  .toast{
    left:15px;
    right:15px;
    bottom:90px;
    max-width:none;
  }

  /*
   * Make the seven bottom navigation buttons fit
   * comfortably on smaller phones.
   */

  .nav{
    padding-left:2px;
    padding-right:2px;
  }

  .nav-item{
    font-size:8px;
  }

  .nav-icon{
    font-size:17px;
    height:22px;
  }
}
</style>
</head>

<body>

<!-- ===================================================
     LOGIN
=================================================== -->

<section id="authScreen" class="auth-screen">

  <div class="login-card">

    <div class="brand-logo">R</div>

    <h1>ROMA Cafe</h1>

    <p class="login-subtitle">
      Inventory Management System
    </p>

    <form id="loginForm">

      <div class="form-group">
        <label for="loginEmail">Email</label>

        <input
          id="loginEmail"
          class="form-control"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>

        <input
          id="loginPassword"
          class="form-control"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        id="loginButton"
        class="btn btn-primary btn-full"
        type="submit"
      >
        Continue
      </button>

    </form>

    <form id="otpForm" class="hidden">

      <div class="otp-info">

        A verification code has been sent to:

        <strong id="otpEmail"></strong>

        <br><br>

        Enter the 6-digit code to continue.

      </div>

      <div class="form-group">

        <label for="otpInput">
          Verification Code
        </label>

        <input
          id="otpInput"
          class="form-control"
          type="text"
          inputmode="numeric"
          maxlength="6"
          placeholder="Enter 6-digit OTP"
          autocomplete="one-time-code"
          required
        >

      </div>

      <button
        id="otpButton"
        class="btn btn-primary btn-full"
        type="submit"
      >
        Verify & Login
      </button>

      <button
        type="button"
        id="backLogin"
        class="back-login"
      >
        Back to login
      </button>

    </form>

  </div>

</section>


<!-- ===================================================
     APPLICATION
=================================================== -->

<section id="appScreen" class="app hidden">

  <!-- SIDEBAR / MOBILE BOTTOM NAVIGATION -->

  <aside id="sidebar" class="sidebar">

    <div class="sidebar-brand">

      <div class="sidebar-logo">
        R
      </div>

      <div class="sidebar-brand-text">

        <strong>ROMA Cafe</strong>

        <span>Inventory System</span>

      </div>

    </div>


    <!--
      On desktop this is the left sidebar.
      On mobile CSS automatically converts this
      into the fixed bottom navigation.
    -->

    <nav class="nav">

      <div class="nav-section">
        Main Menu
      </div>

      <button
        class="nav-item active"
        data-page="dashboard"
      >
        <span class="nav-icon">⌂</span>
        <span>Dashboard</span>
      </button>

      <button
        class="nav-item"
        data-page="inventory"
      >
        <span class="nav-icon">▣</span>
        <span>Inventory</span>
      </button>

      <button
        class="nav-item"
        data-page="stock"
      >
        <span class="nav-icon">↕</span>
        <span>Stock</span>
      </button>

      <button
        class="nav-item"
        data-page="suppliers"
      >
        <span class="nav-icon">♙</span>
        <span>Suppliers</span>
      </button>

      <button
        class="nav-item"
        data-page="transactions"
      >
        <span class="nav-icon">▤</span>
        <span>Transactions</span>
      </button>

      <button
        class="nav-item"
        data-page="reports"
      >
        <span class="nav-icon">▥</span>
        <span>Reports</span>
      </button>

      <button
        class="nav-item"
        data-page="audit"
      >
        <span class="nav-icon">✓</span>
        <span>Audit</span>
      </button>

    </nav>


    <div class="sidebar-user">

      <div id="sidebarUserName" class="user-name">
        User
      </div>

      <div id="sidebarUserRole" class="user-role">
        Staff
      </div>

      <button
        id="logoutButton"
        class="btn btn-secondary logout-btn"
      >
        Logout
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <!-- MOBILE HEADER -->

    <header class="mobile-header">

      <div class="mobile-brand">
        ROMA Cafe

<div id="modalContainer" class="hidden"></div>


<!-- TOAST -->

<div id="toastContainer"></div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzNNtT83ZF0lnoMi0YsaNcmoCr_IGNS2p026eeIjt7QXpL7IHeg1mD2mBYr2_OVUME3/exec";


/* =====================================================
   STATE
===================================================== */

let currentUser = null;
let sessionToken = null;
let sessionExpires = null;

let appData = {
  inventory: [],
  transactions: [],
  suppliers: [],
  audit: []
};

let currentPage = "dashboard";
let otpEmail = "";


/* =====================================================
   DOM
===================================================== */

const authScreen =
  document.getElementById("authScreen");

const appScreen =
  document.getElementById("appScreen");

const loginForm =
  document.getElementById("loginForm");

const otpForm =
  document.getElementById("otpForm");

const loginButton =
  document.getElementById("loginButton");

const otpButton =
  document.getElementById("otpButton");

const content =
  document.getElementById("content");

const modalContainer =
  document.getElementById("modalContainer");

const toastContainer =
  document.getElementById("toastContainer");


/* =====================================================
   API
===================================================== */

async function api(action, data = {}) {

  if (
    !API_URL ||
    API_URL.includes("PASTE_YOUR")
  ) {
    throw new Error(
      "Please add your Apps Script Web App URL in index.html."
    );
  }

  const payload = {
    action: action,
    data: {
      ...data
    }
  };

  if (sessionToken) {
    payload.data.token = sessionToken;
  }

  const response = await fetch(
    API_URL,
    {
      method: "POST",
      body: JSON.stringify(payload)
    }
  );

  const text = await response.text();

  let result;

  try {
    result = JSON.parse(text);
  } catch (error) {
    throw new Error(
      "The server returned an invalid response."
    );
  }

  if (result.unauthorized) {

    clearSession();

    throw new Error(
      "Your session has expired. Please login again."
    );
  }

  if (result.success === false) {

    throw new Error(
      result.message || "Request failed."
    );
  }

  return result;
}


/* =====================================================
   SESSION
===================================================== */

function saveSession(result) {

  sessionToken = result.token;
  sessionExpires = result.expires;
  currentUser = result.user;

  sessionStorage.setItem(
    "roma_token",
    sessionToken
  );

  sessionStorage.setItem(
    "roma_expires",
    String(sessionExpires)
  );

  sessionStorage.setItem(
    "roma_user",
    JSON.stringify(currentUser)
  );
}


function restoreSession() {

  const token =
    sessionStorage.getItem("roma_token");

  const expires =
    Number(
      sessionStorage.getItem("roma_expires") || 0
    );

  const user =
    sessionStorage.getItem("roma_user");

  if (
    !token ||
    !user ||
    !expires ||
    Date.now() >= expires
  ) {

    clearSession();

    return false;
  }

  try {

    sessionToken = token;
    sessionExpires = expires;
    currentUser = JSON.parse(user);

    return true;

  } catch (error) {

    clearSession();

    return false;
  }
}


function clearSession() {

  sessionToken = null;
  sessionExpires = null;
  currentUser = null;

  sessionStorage.removeItem("roma_token");
  sessionStorage.removeItem("roma_expires");
  sessionStorage.removeItem("roma_user");
}


/* =====================================================
   UTILITIES
===================================================== */

function esc(value) {

  return String(
    value === null || value === undefined
      ? ""
      : value
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


function money(value) {

  const amount = Number(value || 0);

  return "₱" +
    amount.toLocaleString(
      "en-PH",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}


function number(value) {

  return Number(value || 0)
    .toLocaleString("en-PH");
}


function formatDate(value) {

  if (!value) {
    return "-";
  }

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return esc(value);
  }

  return date.toLocaleString(
    "en-PH",
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function showToast(
  message,
  type = "success"
) {

  const toast =
    document.createElement("div");

  toast.className =
    "toast " + type;

  toast.textContent = message;

  toastContainer.appendChild(toast);

  setTimeout(
    () => toast.remove(),
    4000
  );
}


function loading() {

  content.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Loading...
    </div>
  `;
}


function pageTitle(title, subtitle) {

  document.getElementById(
    "pageTitle"
  ).textContent = title;

  document.getElementById(
    "pageSubtitle"
  ).textContent = subtitle;
}


/* =====================================================
   AUTH
===================================================== */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
      document.getElementById(
        "loginEmail"
      ).value.trim();

    const password =
      document.getElementById(
        "loginPassword"
      ).value;

    loginButton.disabled = true;

    loginButton.textContent =
      "Sending OTP...";

    try {

      const result =
        await api(
          "requestOTP",
          {
            email:email,
            password:password
          }
        );

      otpEmail = email;

      document.getElementById(
        "otpEmail"
      ).textContent = email;

      loginForm.classList.add("hidden");

      otpForm.classList.remove("hidden");

      document.getElementById(
        "otpInput"
      ).focus();

      showToast(
        result.message,
        "success"
      );

    } catch (error) {

      showToast(
        error.message,
        "error"
      );

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "Continue";
    }
  }
);


otpForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const otp =
      document.getElementById(
        "otpInput"
      ).value.trim();

    otpButton.disabled = true;

    otpButton.textContent =
      "Verifying...";

    try {

      const result =
        await api(
          "verifyOTP",
          {
            email:otpEmail,
            otp:otp
          }
        );

      saveSession(result);

      showApplication();

      await refreshData();

      showToast(
        "Welcome to ROMA Cafe, " +
        currentUser.name + "!",
        "success"
      );

    } catch (error) {

      showToast(
        error.message,
        "error"
      );

    } finally {

      otpButton.disabled = false;

      otpButton.textContent =
        "Verify & Login";
    }
  }
);


document.getElementById(
  "backLogin"
).addEventListener(
  "click",
  function() {

    otpForm.classList.add("hidden");

    loginForm.classList.remove("hidden");

    document.getElementById(
      "otpInput"
    ).value = "";
  }
);


/* =====================================================
   APPLICATION
===================================================== */

function showApplication() {

  authScreen.classList.add("hidden");

  appScreen.classList.remove("hidden");

  document.getElementById(
    "sidebarUserName"
  ).textContent =
    currentUser.name;

  document.getElementById(
    "sidebarUserRole"
  ).textContent =
    currentUser.role;

  document.getElementById(
    "topbarUser"
  ).textContent =
    currentUser.role;

  navigate("dashboard");
}


/* =====================================================
   NAVIGATION
===================================================== */

document
  .querySelectorAll(".nav-item")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function() {

          navigate(
            this.dataset.page
          );

          /*
           * No sidebar closing code here.
           * On mobile the sidebar IS the bottom menu.
           */
        }
      );
    }
  );


async function navigate(page) {

  currentPage = page;

  document
    .querySelectorAll(".nav-item")
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.page === page
        );
      }
    );

  switch(page) {

    case "dashboard":
      renderDashboard();
      break;

    case "inventory":
      renderInventory();
      break;

    case "stock":
      renderStock();
      break;

    case "suppliers":
      renderSuppliers();
      break;

    case "transactions":
      renderTransactions();
      break;

    case "reports":
      renderReports();
      break;

    case "audit":
      renderAudit();
      break;

    default:
      renderDashboard();
  }
}


/* =====================================================
   REFRESH
===================================================== */

async function refreshData() {

  try {

    const result =
      await api("getAllData");

    appData.inventory =
      result.inventory || [];

    appData.transactions =
      result.transactions || [];

    appData.suppliers =
      result.suppliers || [];

    appData.audit =
      result.audit || [];

    currentUser =
      result.user || currentUser;

    sessionStorage.setItem(
      "roma_user",
      JSON.stringify(currentUser)
    );

    renderCurrentPage();

  } catch (error) {

    showToast(
      error.message,
      "error"
    );
  }
}


function renderCurrentPage() {
  navigate(currentPage);
}


/* =====================================================
   DASHBOARD
===================================================== */

function renderInventory() {

  pageTitle(

  );

  content.innerHTML = `

    <div class="page-header">

      <div>

        <h3>
          Inventory
        </h3>

        <p>
          Add, monitor and manage cafe inventory.
        </p>

      </div>

          class="btn btn-primary"
          onclick="openInventoryModal()"

        </button>

      </div>

    </div>


    <div class="panel">

      <div class="panel-body">

        <div class="toolbar">

          <div class="search-box">

            <input
              id="inventorySearch"
              class="form-control"
              type="search"
              placeholder="Search item, code or category..."
              oninput="filterInventory()"
            >

          </div>

        </div>

        <div id="inventoryTable"></div>

      </div>

    </div>

  `;

  renderInventoryTable();
}


function filterInventory() {

  const input =
    document.getElementById(
      "inventorySearch"
    );

  renderInventoryTable(
    input ? input.value.toLowerCase() : ""
  );
}


function renderInventoryTable(search = "") {

  let items =
    appData.inventory.filter(
      item => {

        const text =
          (
            String(item.name) +
            " " +
            String(item.code) +
            " " +
            String(item.category)
          ).toLowerCase();

        return text.includes(search);
      }
    );

  const container =
    document.getElementById(
      "inventoryTable"
    );

  if (!container) {
    return;
  }

  if (!items.length) {

    container.innerHTML = `

      <div class="empty">

        <strong>
          No inventory items found
        </strong>

        Add your first inventory item.

      </div>

    `;

    return;
  }

  container.innerHTML = `

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>Code</th>
            <th>Item</th>
            <th>Category</th>
            <th>Stock</th>
            <th>Cost</th>
            <th>Status</th>
            <th>Action</th>

          </tr>

        </thead>

        <tbody>

          ${items.map(item => {

            const quantity =
              Number(item.quantity || 0);

            const minimum =
              Number(item.minStock || 0);

            let status = "In Stock";
            let badge = "badge-green";

            if (quantity <= 0) {

              status = "Out of Stock";
              badge = "badge-red";

            } else if (quantity <= minimum) {

              status = "Low Stock";
              badge = "badge-orange";
            }

            return `

              <tr>

                <td>
                  <strong>
                    ${esc(item.code)}
                  </strong>
                </td>

                <td>

                  <span class="item-name">
                    ${esc(item.name)}
                  </span>

                  <br>

                  <small class="muted">
                    ${esc(item.unit)}
                  </small>

                </td>

                <td>
                  ${esc(item.category)}
                </td>

                <td>

                  <strong>
                    ${number(quantity)}
                  </strong>

                  ${esc(item.unit)}

                </td>

                <td>
                  ${money(item.cost)}
                </td>

                <td>

                  <span class="badge ${badge}">
                    ${status}
                  </span>

                </td>

                <td>

                  ${
                    currentUser.role === "Admin"
                      ? `
                        <button
                          class="btn btn-danger"
                          style="padding:7px 10px;font-size:12px"
                          onclick="deleteItem('${esc(item.id)}')"
                        >
                          Delete
                        </button>
                      `
                      : `
                        <span class="muted">
                          Staff
                        </span>
                      `
                  }

                </td>

              </tr>

            `;

          }).join("")}

        </tbody>

      </table>

    </div>

  `;
}

async function addInventory(event) {

  event.preventDefault();

  const data = {

    code:
      document.getElementById(
        "itemCode"
      ).value.trim(),

    name:
      document.getElementById(
        "itemName"
      ).value.trim(),

    category:
      document.getElementById(
        "itemCategory"
      ).value,

    unit:
      document.getElementById(
        "itemUnit"
      ).value,

    quantity:
      Number(
        document.getElementById(
          "itemQuantity"
        ).value
      ),

    minStock:
      Number(
        document.getElementById(
          "itemMinStock"
        ).value
      ),

    cost:
      Number(
        document.getElementById(
          "itemCost"
        ).value
      )
  };

  try {

    const result =
      await api(
        "addInventory",
        data
      );

    closeModal();

    showToast(
      result.message,
      "success"
    );

    await refreshData();

  } catch (error) {

    showToast(
      error.message,
      "error"
    );
  }
}


async function deleteItem(itemId) {

  const item =
    appData.inventory.find(
      x =>
        String(x.id) ===
        String(itemId)
    );

  if (!item) {
    return;
  }

  const confirmed =
    confirm(
      'Delete "' +
      item.name +
      '" from inventory?'
    );

  if (!confirmed) {
    return;
  }

  try {

function renderTransactionTable(
  search = "",
  type = ""
) {

  const container =
    document.getElementById(
      "transactionTable"
    );

  if (!container) {
    return;
  }

  const transactions =
    [...appData.transactions]
      .reverse()
      .filter(transaction => {

        const text =
          (
            String(transaction.itemName) +
            " " +
            String(transaction.supplier) +
            " " +
            String(transaction.reason) +
            " " +
            String(transaction.user)
          ).toLowerCase();

        const matchesSearch =
          text.includes(search);

        const matchesType =
          !type ||
          String(transaction.type) === type;

        return matchesSearch &&
          matchesType;
      });

  if (!transactions.length) {

    container.innerHTML = `

      <div class="empty">

        <strong>
          No transactions found
        </strong>

        Stock movements will appear here.

      </div>

    `;

    return;
  }

  container.innerHTML = `

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
            <th>Date</th>
            <th>Item</th>
            <th>Type</th>
            <th>Quantity</th>
            <th>Supplier</th>
            <th>Reason</th>
            <th>User</th>
          </tr>

        </thead>

        <tbody>

          ${transactions.map(transaction => `

            <tr>

              <td>
                ${formatDate(transaction.date)}
              </td>

              <td>

                <span class="item-name">
                  ${esc(transaction.itemName)}
                </span>

              </td>

              <td>

                <span class="badge ${
                  transaction.type === "IN"
                    ? "badge-green"
                    : "badge-red"
                }">

                  ${
                    transaction.type === "IN"
                      ? "STOCK IN"
                      : "STOCK OUT"
                  }

                </span>

              </td>

              <td>

                <strong>
                  ${number(transaction.quantity)}
                </strong>

              </td>

              <td>
                ${esc(transaction.supplier || "-")}
              </td>

              <td>
                ${esc(transaction.reason || "-")}
              </td>

              <td>
                ${esc(transaction.user || "-")}
              </td>

            </tr>

          `).join("")}

        </tbody>

      </table>

    </div>

  `;
}


/* =====================================================
   REPORTS
===================================================== */

function renderReports() {

  pageTitle(
    "Reports",
    "Inventory summaries and stock analysis"
  );

  const inventory =
    appData.inventory;

  const totalValue =
    inventory.reduce(
      (total,item) =>
        total +
        Number(item.quantity || 0) *
        Number(item.cost || 0),
      0
    );

  const lowStock =
    inventory.filter(
      item =>
        Number(item.quantity) <=
        Number(item.minStock)
    );

  const outOfStock =
    inventory.filter(
      item =>
        Number(item.quantity) <= 0
    );

  const categoryMap = {};

  inventory.forEach(item => {

    const category =
      item.category || "Other";

    if (!categoryMap[category]) {

      categoryMap[category] = {
        items:0,
        value:0
      };
    }

    categoryMap[category].items++;

    categoryMap[category].value +=
      Number(item.quantity || 0) *
      Number(item.cost || 0);
  });

  const categories =
    Object.entries(categoryMap);

  content.innerHTML = `

    <div class="page-header">

      <div>

        <h3>
          Inventory Reports
        </h3>

        <p>
          Summary of inventory condition and value.
        </p>

      </div>

      <button
        class="btn btn-primary"
        onclick="window.print()"
      >
        Print Report
      </button>

    </div>

    <div class="three-column">

      <div class="report-card">

        <h4>
          Inventory Value
        </h4>

        <div class="report-number">
          ${money(totalValue)}
        </div>

        <p class="muted">
          Estimated current value
        </p>

      </div>

      <div class="report-card">

        <h4>
          Low Stock Items
        </h4>

        <div
          class="report-number"
          style="color:var(--orange)"
        >
          ${number(lowStock.length)}
        </div>

        <p class="muted">
          Items requiring attention
        </p>

      </div>

      <div class="report-card">

        <h4>
          Out of Stock
        </h4>

        <div
          class="report-number"
          style="color:var(--red)"
        >
          ${number(outOfStock.length)}
        </div>

        <p class="muted">
          Items with zero stock
        </p>

      </div>

    </div>

    <br>

    <div class="two-column">

      <div class="panel">

        <div class="panel-header">

          <h4>
            Category Summary
          </h4>

        </div>

        <div class="panel-body">

          ${
            categories.length
              ? `
                ${categories.map(
                  ([category,info]) => {

                    const percentage =
                      totalValue > 0
                        ? Math.min(
                            100,
                            (
                              info.value /
                              totalValue
                            ) * 100
                          )
                        : 0;

                    return `

                      <div
                        style="margin-bottom:22px"
                      >

                        <div
                          style="
                            display:flex;
                            justify-content:space-between;
                            gap:10px;
                          "
                        >

                          <strong>
                            ${esc(category)}
                          </strong>

                          <span class="muted">
                            ${number(info.items)}
                            items
                          </span>

                        </div>

                        <div class="progress">

                          <div
                            class="progress-bar"
                            style="width:${percentage}%"
                          ></div>

                        </div>

                        <div
                          style="
                            margin-top:5px;
                            font-size:12px;
                            color:var(--muted);
                          "
                        >
                          ${money(info.value)}
                        </div>

                      </div>

                    `;
                  }
                ).join("")}
              `
              : `
                <div class="empty">

                  <strong>
                    No report data
                  </strong>

                  Add inventory items first.

                </div>
              `
          }

        </div>

      </div>

      <div class="panel">

        <div class="panel-header">

          <h4>
            Low Stock Details
          </h4>

        </div>

        <div class="panel-body">

          ${
            lowStock.length
              ? `
                <div class="table-wrapper">

                  <table>

                    <thead>

                      <tr>
                        <th>Item</th>
                        <th>Current</th>
                        <th>Minimum</th>
                      </tr>

                    </thead>

                    <tbody>

                      ${lowStock.map(item => `

                        <tr>

                          <td>

                            <span class="item-name">
                              ${esc(item.name)}
                            </span>

                          </td>

                          <td>

                            <span class="badge badge-orange">

                              ${number(item.quantity)}
                              ${esc(item.unit)}

                            </span>

                          </td>

                          <td>

                            ${number(item.minStock)}
                            ${esc(item.unit)}

                          </td>

                        </tr>

                      `).join("")}

                    </tbody>

                  </table>

                </div>
              `
              : `
                <div class="empty">

                  <strong>
                    No low stock items
                  </strong>

                  Inventory levels are currently healthy.

                </div>
              `
          }

        </div>

      </div>

    </div>

  `;
}

/* =====================================================
   MODAL
===================================================== */

function closeModal() {

  modalContainer.classList.add("hidden");

  modalContainer.innerHTML = "";
}


/* =====================================================
   LOGOUT
===================================================== */

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async function() {

      const confirmed =
        confirm(
          "Are you sure you want to logout?"
        );

      if (!confirmed) {
        return;
      }

      try {

        await api("logout");

      } catch (error) {

        console.warn(
          error.message
        );
      }

      clearSession();

      appScreen.classList.add("hidden");

      authScreen.classList.remove("hidden");

      loginForm.classList.remove("hidden");

      otpForm.classList.add("hidden");

      document.getElementById(
        "loginPassword"
      ).value = "";

      document.getElementById(
        "otpInput"
      ).value = "";

      showToast(
        "You have been logged out.",
        "success"
      );
    }
  );


/* =====================================================
   SESSION CHECK
===================================================== */

setInterval(
  function() {

    if (
      sessionToken &&
      sessionExpires &&
      Date.now() >= sessionExpires
    ) {

      clearSession();

      appScreen.classList.add("hidden");

      authScreen.classList.remove("hidden");

      loginForm.classList.remove("hidden");

      otpForm.classList.add("hidden");

      showToast(
        "Your session has expired. Please login again.",
        "error"
      );
    }

  },
  30000
);


/* =====================================================
   START APPLICATION
===================================================== */

async function startApplication() {

  if (restoreSession()) {

    showApplication();

    loading();

    await refreshData();

    return;
  }

  authScreen.classList.remove("hidden");

  appScreen.classList.add("hidden");
}

startApplication();

</script>
