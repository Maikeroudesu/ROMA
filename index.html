  <script>

    /* =====================================================
       CONFIGURATION
    ====================================================== */

    const CONFIG = {

      /*
       * REPLACE THIS WITH YOUR
       * GOOGLE APPS SCRIPT /exec URL
       */

      API_URL:
        "https://script.google.com/macros/s/AKfycbxqc3p44YPOSCK5kg0Wn0lKHskBmGdNkF3HS2vPllVJMsQ-aYJLzgYEG_mtGfF-Ckok/exec",

      APP_NAME:
        "ROMA Cafe Inventory System"

    };



    /* =====================================================
       STATE
    ====================================================== */

    const state = {

      user:
        JSON.parse(
          sessionStorage.getItem(
            "roma_user"
          ) || "null"
        ),

      token:
        sessionStorage.getItem(
          "roma_token"
        ),

      inventory: [],

      transactions: [],

      suppliers: [],

      audit: [],

      pendingEmail: ""

    };



    /* =====================================================
       HELPERS
    ====================================================== */

    const $ =
      id =>
        document.getElementById(id);


    function esc(value) {

      return String(
        value ?? ""
      ).replace(
        /[&<>"']/g,
        character => ({

          "&":
            "&amp;",

          "<":
            "&lt;",

          ">":
            "&gt;",

          '"':
            "&quot;",

          "'":
            "&#039;"

        }[character])
      );

    }


    function money(number) {

      return `₱${Number(
        number || 0
      ).toLocaleString(
        "en-PH",
        {
          minimumFractionDigits:
            2,

          maximumFractionDigits:
            2
        }
      )}`;

    }


    function dateFmt(value) {

      if (!value) {
        return "—";
      }

      const date =
        new Date(value);

      if (
        isNaN(date.getTime())
      ) {
        return String(value);
      }

      return date.toLocaleString(
        "en-PH",
        {
          dateStyle:
            "medium",

          timeStyle:
            "short"
        }
      );

    }


    /* =====================================================
       TOAST
    ====================================================== */

    function toast(
      message,
      type = "success"
    ) {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "card toast";


      if (
        type === "danger"
      ) {

        element.style.borderColor =
          "#f0b7b1";

      }


      element.textContent =
        message;


      $("toast-container")
        .appendChild(
          element
        );


      setTimeout(
        () =>
          element.remove(),
        3200
      );

    }



    /* =====================================================
       API
    ====================================================== */

    const API = {


      async post(
        action,
        data = {}
      ) {

        if (
          !CONFIG.API_URL ||
          CONFIG.API_URL.includes(
            "PASTE_YOUR"
          )
        ) {

          throw new Error(
            "Please configure your Apps Script Web App URL."
          );

        }


        const response =
          await fetch(
            CONFIG.API_URL,
            {

              method:
                "POST",

              headers:
                {
                  "Content-Type":
                    "text/plain;charset=utf-8"
                },

              body:
                JSON.stringify({
                  action,
                  data
                })

            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            `Server returned ${response.status}.`
          );

        }


        return await response.json();

      },


      requestOTP(
        email,
        password
      ) {

        return this.post(
          "requestOTP",
          {
            email,
            password
          }
        );

      },


      verifyOTP(
        email,
        otp
      ) {

        return this.post(
          "verifyOTP",
          {
            email,
            otp
          }
        );

      },

        token
      ) {

        return this.post(
          "getAllData",

    /* =====================================================
       LOAD DATA
    ====================================================== */

    async function loadData() {

      if (
        !state.token
      ) {

        showAuth();

        return;

      }


      $("refresh-btn")
        .disabled = true;


      try {

        const result =
          await API.allData(
            state.token
          );


        if (
          !result.success
        ) {

          if (
            result.message &&
            result.message
              .toLowerCase()
              .includes(
                "unauthorized"
              )
          ) {

            sessionExpired();

            return;

          }

          throw new Error(
            result.message ||
            "Unable to load data."
          );

        }


        state.inventory =
          result.inventory || [];


        state.transactions =
          result.transactions || [];


        state.suppliers =
          result.suppliers || [];


        state.audit =
          result.audit || [];


        renderCurrent();

      }

      catch (error) {

        toast(
          error.message,
          "danger"
        );

      }

      finally {

        $("refresh-btn")
          .disabled = false;

      }

    }



    /* =====================================================
       SESSION EXPIRED
    ====================================================== */

    function sessionExpired() {

      sessionStorage.removeItem(
        "roma_token"
      );

      sessionStorage.removeItem(
        "roma_user"
      );


      state.token =
        null;

      state.user =
        null;


      toast(
        "Your session has expired. Please log in again.",
        "danger"
      );


      setTimeout(
        () =>
          location.reload(),
        1200
      );

    }

            <div class="form-actions">

                type="button"

              >

              </button>


              <button
                class="btn primary"
                type="submit"
              >
                Save Item
              </button>


            </div>

          </form>

        `
      );


      $("inventory-form")
        .onsubmit =
          async event => {

            event.preventDefault();

              const item = {

                code:
                  $("item-code")
                    .value
                    .trim(),

                name:
                  $("item-name")
                    .value
                    .trim(),

                category:
                  $("item-category")
                    .value
                    .trim(),

                unit:
                  $("item-unit")
                    .value

                quantity:
                  $("item-qty")
                    .value,

                  $("item-min")
                    .value,

                cost:
                  $("item-cost")
                    .value

              };


              const result =
                await API.addInventory(
                  state.token,

                );


              if (
                !result.success
              ) {

                  result.message ||

    }



    /* =====================================================
       DELETE INVENTORY
    ====================================================== */

    async function deleteItem(
      id
    ) {

      if (
        state.user.role !==
        "Admin"
      ) {

        toast(
          "Admin permission required.",
          "danger"
        );

        return;

      }


      const item =
        state.inventory.find(
          value =>
            String(value.id) ===
            String(id)
        );


      if (!item) {
        return;
      }


      const confirmed =
        confirm(
          `Delete "${item.name}"? This cannot be undone.`
        );


      if (!confirmed) {
        return;
      }


      try {

        const result =
          await API.deleteInventory(
            state.token,
            id
          );


        if (
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Unable to delete item."
          );

        }


        toast(
          "Item deleted."
        );


        await loadData();

      }

      catch (error) {

        toast(
          error.message,
          "danger"
        );

      }

    }

    /* =====================================================

    ====================================================== */

    async function submitStock(
      event
    ) {

      event.preventDefault();


      try {

        const payload = {

          type:
            $("stock-type")
              .value,

          itemId:
            $("stock-item")
              .value,

          quantity:
            $("stock-qty")
              .value,

          supplier:
            $("stock-supplier")
              .value
              .trim(),

          reason:
            $("stock-reason")
              .value
              .trim()

        };


        const result =
          await API.stockTransaction(
            state.token,
            payload
          );


        if (
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Unable to record transaction."
          );

        }


        toast(
          "Stock transaction recorded."
        );


        event.target.reset();


        await loadData();

      }

      catch (error) {

        toast(
          error.message,
          "danger"
        );

      }

    }



    /* =====================================================
       MODAL
    ====================================================== */

    function modal(
      title,
      body
    ) {

      $("modal-root")
        .innerHTML = `

          <div
            class="modal-backdrop"
            onclick="
              if(event.target === this)
                closeModal()
            "
          >

            <div class="modal">


              <div class="modal-head">

                <h3>
                  ${title}
                </h3>


                <button
                  class="close"
                  onclick="closeModal()"
                >
                  ✕
                </button>

              </div>


              ${body}

            </div>

          </div>

        `;

    }


    function closeModal() {

      $("modal-root")
        .innerHTML = "";

    }



    /* =====================================================
       LOGIN
    ====================================================== */

    $("login-form")
      .onsubmit =
        async event => {

          event.preventDefault();


          const email =
            $("login-email")
              .value
              .trim()
              .toLowerCase();


          const password =
            $("login-password")
              .value;


          try {

            const result =
              await API.requestOTP(
                email,
                password
              );


            if (
              !result.success
            ) {

              throw new Error(
                result.message ||
                "Login failed."
              );

            }


            state.pendingEmail =
              email;


            $("login-form")
              .classList
              .add("hidden");


            $("otp-form")
              .classList
              .remove("hidden");


            $("otp-code")
              .focus();


            toast(
              "OTP sent to your email."
            );

          }

          catch (error) {

            toast(
              error.message,
              "danger"
            );

          }

        };



    /* =====================================================
       OTP
    ====================================================== */

    $("otp-form")
      .onsubmit =
        async event => {

          event.preventDefault();


          const otp =
            $("otp-code")
              .value
              .trim();


          try {

            const result =
              await API.verifyOTP(
                state.pendingEmail,
                otp
              );


            if (
              !result.success
            ) {

              throw new Error(
                result.message ||
                "OTP verification failed."
              );

            }


            /*
             * SERVER-GENERATED TOKEN
             */

            state.user =
              result.user;


            state.token =
              result.token;


            sessionStorage.setItem(
              "roma_user",
              JSON.stringify(
                result.user
              )
            );


            sessionStorage.setItem(
              "roma_token",
              result.token
            );


            showApp();


            await loadData();

          }

          catch (error) {

            toast(
              error.message,
              "danger"
            );

          }

        };



    /* =====================================================
       BACK TO LOGIN
    ====================================================== */

    $("back-login")
      .onclick = () => {

        $("otp-form")
          .classList
          .add("hidden");


        $("login-form")
          .classList
          .remove("hidden");


        $("otp-code")
          .value = "";

      };



    /* =====================================================
       LOGOUT
    ====================================================== */

    $("logout-btn")
      .onclick =
        async () => {

          try {

            if (
              state.token
            ) {

              await API.logout(
                state.token
              );

            }

          }

          catch (error) {

            console.warn(
              error
            );

          }


          sessionStorage.removeItem(
            "roma_token"
          );


          sessionStorage.removeItem(
            "roma_user"
          );


          state.token =
            null;


          state.user =
            null;


          location.reload();

        };



    /* =====================================================
       REFRESH
    ====================================================== */

    $("refresh-btn")
      .onclick =
        loadData;



    /* =====================================================
       MOBILE MENU
    ====================================================== */

    $("menu-btn")
      .onclick =
        () =>
          $("sidebar")
            .classList
            .toggle("open");



    /* =====================================================
       NAVIGATION
    ====================================================== */

    document
      .querySelectorAll(
        ".nav-link"
      )
      .forEach(
        button => {

          button.onclick = () => {

            document
              .querySelectorAll(
                ".nav-link"
              )
              .forEach(
                item =>
                  item
                    .classList
                    .remove(
                      "active"
                    )
              );


            button
              .classList
              .add(
                "active"
              );


            renderPage(
              button.dataset.page
            );


            $("sidebar")
              .classList
              .remove(
                "open"
              );

          };

        }
      );



    /* =====================================================
       START APPLICATION
    ====================================================== */

    if (
      state.user &&
      state.token
    ) {

      showApp();

      loadData();

    }

    else {

      showAuth();

    }

  </script>
