<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROMA Cafe | Inventory Management</title>

  <style>
    /* =========================================================
       ROMA CAFE INVENTORY SYSTEM
       Single-file GitHub frontend
       ========================================================= */

    :root {
      --bg: #f5f7fb;
      --white: #ffffff;
      --dark: #111827;
      --dark-2: #1f2937;
      --text: #172033;
      --muted: #6b7280;
      --line: #e5e7eb;

      --gold: #b7791f;
      --gold-dark: #8b5e16;
      --gold-light: #fff7e8;

      --green: #15803d;
      --green-light: #dcfce7;

      --red: #dc2626;
      --red-light: #fee2e2;

      --orange: #d97706;
      --orange-light: #fef3c7;

      --blue: #2563eb;
      --blue-light: #dbeafe;

      --radius: 16px;
      --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       AUTHENTICATION
       ========================================================= */

    .auth-screen {
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top right,
          #f6d69b,
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #ffffff,
          #f4f1eb
        );
    }

    .auth-card {
      width: min(430px, 100%);

      background: var(--white);

      border: 1px solid var(--line);

      border-radius: 24px;

      padding: 30px;

      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;

      display: grid;
      place-items: center;

      border-radius: 15px;

      background: var(--dark);
      color: #f6d69b;

      font-weight: 900;
      font-size: 20px;
    }

    .brand h1 {
      margin: 0;

      font-size: 20px;
    }

    .brand p {
      margin: 2px 0 0;

      color: var(--muted);

      font-size: 13px;
    }

    .auth-card h2 {
      margin: 28px 0 7px;
    }

    .auth-description {
      color: var(--muted);

      font-size: 14px;

      line-height: 1.6;

      margin-top: 0;
    }

    .field {
      margin: 15px 0;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid #d1d5db;

      border-radius: 11px;

      outline: none;

      background: #fff;

      color: var(--text);
    }

    .field textarea {
      min-height: 90px;

      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 3px
        rgba(183, 121, 31, 0.14);
    }

    .btn {
      border: 0;

      padding: 11px 15px;

      border-radius: 11px;

      font-weight: 800;

      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.55;

      cursor: not-allowed;

      transform: none;
    }

    .btn-primary {
      width: 100%;

      background: var(--dark);

      color: white;
    }

    .btn-gold {
      background: var(--gold);

      color: white;
    }

    .btn-gold:hover {
      background: var(--gold-dark);
    }

    .btn-ghost {
      background: #f3f4f6;

      color: var(--text);
    }

    .btn-danger {
      background: var(--red-light);

      color: #991b1b;
    }

    .btn-blue {
      background: var(--blue-light);

      color: #1d4ed8;
    }

    .alert {
      padding: 10px 12px;

      border-radius: 10px;

      font-size: 13px;

      margin: 12px 0;

      line-height: 1.5;
    }

    .alert-error {
      color: #b91c1c;

      background: #fef2f2;

      border: 1px solid #fecaca;
    }

    .alert-success {
      color: #166534;

      background: #f0fdf4;

      border: 1px solid #bbf7d0;
    }

    /* =========================================================
       TOP BAR
       ========================================================= */

    .topbar {
      height: 68px;

      background: var(--dark);

      color: white;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 22px;

      position: sticky;

      top: 0;

      z-index: 50;
    }

    .topbar .brand p {
      color: #cbd5e1;
    }

    .top-actions {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    .menu-button {
      display: none;

      background: transparent;

      color: white;

      border: 0;

      font-size: 25px;
    }

    .avatar {
      width: 36px;
      height: 36px;

      border-radius: 50%;

      display: grid;

      place-items: center;

      background: #f6d69b;

      color: var(--dark);

      font-weight: 900;
    }

    .user-name {
      font-size: 13px;

      font-weight: 700;
    }

    .user-role {
      font-size: 11px;

      color: #cbd5e1;
    }

    /* =========================================================
       LAYOUT
       ========================================================= */

    .layout {
      display: flex;

      min-height:
        calc(100vh - 68px);
      min-height:
        calc(100dvh - 68px);
    }

    .sidebar {
      width: 245px;

      flex-shrink: 0;

      background: white;

      border-right: 1px solid var(--line);

      padding: 18px 12px;

      position: sticky;

      top: 68px;

      height:
        calc(100vh - 68px);
      height:
        calc(100dvh - 68px);

      overflow-y: auto;
    }

    .nav-label {
      font-size: 10px;

      font-weight: 900;

      color: #9ca3af;

      text-transform: uppercase;

      padding: 12px 12px 8px;

      letter-spacing: 0.08em;
    }

    .nav {
      display: grid;

      gap: 5px;
    }

    .nav button {
      display: flex;

      align-items: center;

      gap: 11px;

      padding: 12px;

      border-radius: 11px;

      border: 0;

      background: transparent;

      color: #4b5563;

      text-align: left;

      font-weight: 700;
    }

    .nav button:hover {
      background: #f8fafc;
    }

    .nav button.active {
      background: var(--gold-light);

      color: var(--gold-dark);
    }

    .nav-icon {
      width: 22px;

      text-align: center;
    }

    .main {
      flex: 1;

      min-width: 0;

      padding: 24px;
    }

    /* =========================================================
       PAGE HEADER
       ========================================================= */

    .page-head {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;
    }

    .page-head h2 {
      margin: 0;

      font-size: 24px;
    }

    .page-head p {
      margin: 5px 0 0;

      color: var(--muted);

      font-size: 13px;
    }

    .head-actions {
      display: flex;

      align-items: center;

      gap: 8px;

      flex-wrap: wrap;
    }

    /* =========================================================
       CARDS
       ========================================================= */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 15px;
    }

    .card {
      background: white;

      border: 1px solid var(--line);

      border-radius: var(--radius);

      padding: 18px;

      box-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.025);
    }

    .stat {
      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 12px;
    }

    .stat small {
      color: var(--muted);

      font-weight: 700;
    }

    .stat strong {
      display: block;

      margin-top: 8px;

      font-size: 28px;
    }

    .stat-icon {
      width: 42px;
      height: 42px;

      display: grid;

      place-items: center;

      border-radius: 13px;

      background: var(--gold-light);

      font-size: 18px;
    }

    .section-grid {
      display: grid;

      grid-template-columns:
        1.4fr 0.8fr;

      gap: 15px;

      margin-top: 15px;
    }

    .card-title {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 15px;
    }

    .card-title h3 {
      margin: 0;

      font-size: 16px;
    }

    .muted {
      color: var(--muted);
    }

    /* =========================================================
       TABLES
       ========================================================= */

    .table-wrap {
      overflow-x: auto;

      border: 1px solid var(--line);

      border-radius: 13px;
    }

    .table {
      width: 100%;

      min-width: 650px;

      border-collapse: collapse;
    }

    .table th,
    .table td {
      padding: 12px 13px;

      border-bottom: 1px solid var(--line);

      text-align: left;

      font-size: 13px;

      white-space: nowrap;
    }

    .table th {
      background: #f9fafb;

      color: #6b7280;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.03em;
    }

    .table tr:last-child td {
      border-bottom: 0;
    }

    .badge {
      display: inline-flex;

      align-items: center;

      padding: 4px 8px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 800;
    }

    .badge-green {
      background: var(--green-light);

      color: #166534;
    }

    .badge-red {
      background: var(--red-light);

      color: #991b1b;
    }

    .badge-orange {
      background: var(--orange-light);

      color: #92400e;
    }

    .badge-blue {
      background: var(--blue-light);

      color: #1d4ed8;
    }

    .badge-gray {
      background: #f3f4f6;

      color: #4b5563;
    }

    .low-stock {
      color: #b91c1c;

      font-weight: 900;
    }

    .empty {
      padding: 35px;

      text-align: center;

      color: var(--muted);
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .search {
      width: min(280px, 100%);

      padding: 10px 12px;

      border: 1px solid var(--line);

      border-radius: 10px;

      background: white;

      outline: none;
    }

    .search:focus {
      border-color: var(--gold);
    }

    .filters {
      display: flex;

      align-items: center;

      gap: 8px;

      flex-wrap: wrap;

      margin-bottom: 13px;
    }

    /* =========================================================
       MODAL
       ========================================================= */

    .modal-backdrop {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: grid;

      place-items: center;

      padding: 18px;

      background:
        rgba(17, 24, 39, 0.55);
    }

    .modal {
      width: min(580px, 100%);

      max-height: 90dvh;

      overflow-y: auto;

      background: white;

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.2);
    }

    .modal-head {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 5px;
    }

    .modal-head h3 {
      margin: 0;
    }

    .close-button {
      width: 34px;
      height: 34px;

      border: 0;

      border-radius: 9px;

      background: #f3f4f6;

      font-size: 20px;
    }

    .form-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 4px 12px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .modal-actions {
      display: flex;

      justify-content: flex-end;

      gap: 8px;

      margin-top: 16px;
    }

    /* =========================================================
       TOAST
       ========================================================= */

    .toast {
      position: fixed;

      right: 20px;

      bottom: 20px;

      z-index: 200;

      max-width: 360px;

      padding: 12px 15px;

      border-radius: 11px;

      background: var(--dark);

      color: white;

      box-shadow: var(--shadow);

      font-size: 13px;
    }

    /* =========================================================
       MOBILE NAVIGATION
       ========================================================= */

    .mobile-nav {
      display: none;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 1050px) {
      .grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .section-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {

      .topbar {
        padding: 0 14px;
      }

      .menu-button {
        display: block;
      }

      .user-name,
      .user-role {
        display: none;
      }

      .sidebar {
        position: fixed;

        left: 0;

        top: 68px;

        bottom: 0;

        height: auto;

        z-index: 45;

        transform:
          translateX(-105%);

        transition: 0.2s ease;

        box-shadow:
          10px 0 30px
          rgba(0, 0, 0, 0.12);
      }

      .sidebar.open {
        transform:
          translateX(0);
      }

      .main {
        padding:
          16px
          14px
          84px;
      }

      .page-head {
        align-items: flex-start;

        flex-direction: column;
      }

      .page-head h2 {
        font-size: 21px;
      }

      .head-actions {
        width: 100%;
      }

      .head-actions .search {
        flex: 1;

        width: auto;
      }

      .grid {
        grid-template-columns:
          1fr 1fr;

        gap: 10px;
      }

      .card {
        padding: 14px;
      }

      .stat strong {
        font-size: 23px;
      }

      .mobile-nav {
        display: grid;

        position: fixed;

        left: 0;

        right: 0;

        bottom: 0;

        z-index: 60;

        height: 64px;

        padding-bottom:
          env(safe-area-inset-bottom);

        grid-template-columns:
          repeat(4, 1fr);

        background: white;

        border-top: 1px solid var(--line);
      }

      .mobile-nav button {
        border: 0;

        background: white;

        color: #6b7280;

        font-size: 10px;

        font-weight: 800;
      }

      .mobile-nav button.active {
        color: var(--gold-dark);
      }

      .mobile-nav span {
        display: block;

        font-size: 18px;

        margin-bottom: 2px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .auth-card {
        padding: 24px;
      }
    }

    @media (max-width: 430px) {
      .topbar .logo {
        width: 40px;
        height: 40px;

        font-size: 17px;
      }

      .topbar .brand h1 {
        font-size: 17px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .stat {
        min-height: 90px;
      }

      .auth-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================

  <section id="authView" class="auth-screen">

    <div class="auth-card">

<script>

/* =============================================================
   ROMA CAFE FRONTEND CONFIGURATION
   =============================================================

   IMPORTANT:

   Replace the value below with your deployed Apps Script
   Web App URL.

   Example:

   https://script.google.com/macros/s/XXXXXXXXXXXX/exec

   ============================================================= */

const CONFIG = {

  API_URL:
    "https://script.google.com/macros/s/AKfycbwjXEfec4TrdLBNvurxwQmF-oLmsMEQxy6gU6bWuhDjpLeIMbamDpYK5SwcqAstb5wF/exec"

};


/* =============================================================
   APPLICATION STATE
   ============================================================= */

const state = {

  user: null,

  data: {

    inventory: [],

    transactions: [],

    suppliers: [],

    audit: []

  },

  page: "dashboard",

  query: ""

};


/* =============================================================
   HELPERS
   ============================================================= */

const $ = id =>
  document.getElementById(id);


function escapeHTML(value) {

  return String(value ?? "")
    .replace(
      /[&<>'"]/g,
      character => {

        const map = {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;"

        };

        return map[character];

      }
    );

}


function money(value) {

  return "₱" +
    Number(value || 0)
      .toLocaleString(
        "en-PH",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );

}


function formatDate(value) {

  if (!value) {
    return "—";
  }

  const date =
    new Date(value);

  if (Number.isNaN(date.getTime())) {
    return escapeHTML(value);
  }

  return date.toLocaleString(
    "en-PH",
    {
      dateStyle: "medium",
      timeStyle: "short"
    }
  );

}


function initials(name) {

  return String(name || "ROMA")
    .split(" ")
    .map(part => part[0])
    .join("")
    .slice(0, 2)
    .toUpperCase();

}


function showToast(message) {

  const toast =
    $("toast");

  toast.textContent =
    message;

  toast.classList.remove(
    "hidden"
  );

  setTimeout(
    () =>
      toast.classList.add(
        "hidden"
      ),
    2800
  );

}


function showMessage(
  elementId,
  message,
  type = "error"
) {

  const element =
    $(elementId);

  if (!message) {

    element.innerHTML = "";

    return;
  }

  element.innerHTML = `

    <div class="alert alert-${type}">
      ${escapeHTML(message)}
    </div>

  `;

}


/* =============================================================
   API
   ============================================================= */

async function api(
  action,
  data = {}
) {

  if (
    CONFIG.API_URL.includes(
      "PASTE_YOUR"
    )
  ) {

    throw new Error(
      "Please set your Apps Script Web App URL in CONFIG.API_URL."
    );

  }


  const response =
    await fetch(
      CONFIG.API_URL,
      {

        method: "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify({

            action,

            data

          })

      }
    );


  if (!response.ok) {

    throw new Error(
      "Server request failed."
    );

  }


  const result =
    await response.json();


  if (!result.success) {

    throw new Error(
      result.message ||
      "Request failed."
    );

  }


  return result;

}

function getSessionUser() {

  try {

    return JSON.parse(
      sessionStorage.getItem(
        "romaUser"
      ) || "null"
    );

  } catch {

    return null;

  }

}


function saveSessionUser(user) {

  state.user =
    user;

  sessionStorage.setItem(
    "romaUser",
    JSON.stringify(user)
  );

}


function clearSession() {

  state.user =
    null;

  sessionStorage.removeItem(
    "romaUser"
  );

}

$("requestOtpButton").onclick =
  async function () {

    const email =
      $("email")
        .value
        .trim()
        .toLowerCase();

    const password =
      $("password")
        .value;


    showMessage(
      "loginMessage",
      ""
    );


    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Email and password are required."
      );

      return;

    }


    const button =
      $("requestOtpButton");

    button.disabled =
      true;

    button.textContent =
      "Sending OTP…";


    try {

      await api(
        "requestOTP",
        {
          email,
          password
        }
      );


      $("otpEmail")
        .textContent =
        email;


      $("loginStep")
        .classList
        .add("hidden");

      $("otpStep")
        .classList
        .remove("hidden");


      $("otp")
        .focus();


      showToast(
        "OTP sent to your email."
      );


    } catch (error) {

      showMessage(
        "loginMessage",
        error.message
      );

    } finally {

      button.disabled =
        false;

      button.textContent =
        "Continue with OTP";

    }

  };


/* =============================================================
   VERIFY OTP
   ============================================================= */

$("verifyOtpButton").onclick =
  async function () {

    const email =
      $("email")
        .value
        .trim()
        .toLowerCase();

    const otp =
      $("otp")
        .value
        .trim();


    showMessage(
      "otpMessage",
      ""
    );


    if (!/^\d{6}$/.test(otp)) {

      showMessage(
        "otpMessage",
        "Enter the 6-digit OTP."
      );

      return;

    }


    const button =
      $("verifyOtpButton");

    button.disabled =
      true;

    button.textContent =
      "Verifying…";


    try {

      const result =
        await api(
          "verifyOTP",
          {
            email,
            otp
          }
        );


      saveSessionUser(
        result.user
      );


      await startApplication();


    } catch (error) {

      showMessage(
        "otpMessage",
        error.message
      );

    } finally {

      button.disabled =
        false;

      button.textContent =
        "Verify & Sign In";

    }

  };

  const transactions =
    state.data.transactions;


  const categoryValues =
    {};


  inventory.forEach(
    item => {

      const category =
        item.category ||
        "Uncategorized";


      categoryValues[category] =
        (
          categoryValues[category] ||
          0
        ) +

        Number(item.quantity || 0) *
        Number(item.cost || 0);

    }
  );


  const unitsIn =
    transactions
      .filter(

/* =============================================================
   FILTERING
   ============================================================= */

function filtered(
  list,
  fields
) {

  const query =
    state.query
      .toLowerCase();


  if (!query) {

    return list;

  }


  return list.filter(
    item =>
      fields.some(
        field =>
          String(
            item[field] ?? ""
          )
          .toLowerCase()
          .includes(query)
      )
  );

}


/* =============================================================
   STOCK BADGE
   ============================================================= */

function stockBadge(item) {

  const quantity =
    Number(item.quantity || 0);

  const minimum =
    Number(item.minStock || 0);


  if (quantity <= minimum) {

    return `

      <span class="badge badge-red">
        Low Stock
      </span>

    `;

  }


  return `

    <span class="badge badge-green">
      Healthy
    </span>

  `;

}


/* =============================================================
   TRANSACTION TABLE
   ============================================================= */

function transactionTable(
  transactions
) {

  if (!transactions.length) {

    return `

      <div class="empty">
        No transactions found.
      </div>

    `;

  }


  return `

    <div class="table-wrap">

      <table class="table">

        <thead>

          <tr>

            <th>
              Date
            </th>

            <th>
              Type
            </th>

            <th>
              Item
            </th>

            <th>
              Quantity
            </th>

            <th>
              Supplier
            </th>

            <th>
              Reason
            </th>

            <th>
              User
            </th>

          </tr>

        </thead>

        <tbody>

          ${transactions
            .map(
              transaction => `

                <tr>

                  <td>
                    ${formatDate(transaction.date)}
                  </td>

                  <td>

                    <span
                      class="badge ${
                        transaction.type === "IN"
                          ? "badge-green"
                          : "badge-orange"
                      }"
                    >
                      ${escapeHTML(transaction.type)}
                    </span>

                  </td>

                  <td>
                    ${escapeHTML(transaction.itemName)}
                  </td>

                  <td>
                    ${transaction.quantity}
                  </td>

                  <td>
                    ${
                      escapeHTML(
                        transaction.supplier
                      ) || "—"
                    }
                  </td>

                  <td>
                    ${
                      escapeHTML(
                        transaction.reason
                      ) || "—"
                    }
                  </td>

                  <td>
                    ${escapeHTML(transaction.user)}
                  </td>

                </tr>

              `
            )
            .join("")}

        </tbody>

      </table>

    </div>

  `;

}


/* =============================================================
   PAGE EVENTS
   ============================================================= */

function bindPageEvents() {

  const search =
    $("pageSearch");


  if (search) {

    search.oninput =
      function () {

        state.query =
          search.value;

        render();


        const newSearch =
          $("pageSearch");


        if (newSearch) {

          newSearch.focus();

          newSearch.setSelectionRange(
            state.query.length,
            state.query.length
          );

        }

      };

  }


  document
    .querySelectorAll(
      "[data-go]"
    )
    .forEach(
      button => {

        button.onclick =
          () =>
            setPage(
              button.dataset.go
            );

      }
    );


  document
    .querySelectorAll(
      "[data-action]"
    )
    .forEach(
      button => {

        button.onclick =
          () =>
            openModal(
              button.dataset.action
            );

      }
    );


  document
    .querySelectorAll(
      "[data-delete]"
    )
    .forEach(
      button => {

        button.onclick =
          () =>
            deleteInventoryItem(
              button.dataset.delete
            );

      }
    );


  const typeFilter =
    $("typeFilter");


  if (typeFilter) {

    typeFilter.onchange =
      function () {

        const selected =
          typeFilter.value;


        const filteredTransactions =
          state.data.transactions
            .filter(
              transaction =>
                !selected ||
                transaction.type === selected
            );


        const card =
          $("main")
            .querySelector(".card");


        if (!card) {
          return;
        }


        card.innerHTML = `

          <div class="filters">

            <select
              id="typeFilter"
              class="search"
            >

              <option value="">
                All Types
              </option>

              <option
                value="IN"
                ${
                  selected === "IN"
                    ? "selected"
                    : ""
                }
              >
                Stock In
              </option>

              <option
                value="OUT"
                ${
                  selected === "OUT"
                    ? "selected"
                    : ""
                }
              >
                Stock Out
              </option>

            </select>


            <input
              id="pageSearch"
              class="search"
              placeholder="Search item, supplier, reason…"
              value="${escapeHTML(state.query)}"
            >

          </div>

          ${transactionTable(
            filtered(
              filteredTransactions,
              [
                "itemName",
                "supplier",
                "reason",
                "user"
              ]
            )
          )}

        `;


        bindPageEvents();

      };

  }

}

/* =============================================================
   CLOSE MODAL
   ============================================================= */

function closeModal() {

  $("modalRoot")
    .innerHTML = "";

}


/* =============================================================
   SUBMIT MODAL
   ============================================================= */

async function submitModal(
  event,
  type
) {

  event.preventDefault();


  const form =
    event.target;


  const formData =
    new FormData(form);


  const values =
    Object.fromEntries(
      formData.entries()
    );


  try {

    let result;


    /* ADD INVENTORY */

    if (
      type === "addInventory"
    ) {

      result =
        await api(
          "addInventory",
          {

            user:
              state.user,

            item: {

              code:
                values.code,

              name:
                values.name,

              category:
                values.category,

              unit:
                values.unit,

              quantity:
                Number(
                  values.quantity
                ),

              minStock:
                Number(
                  values.minStock
                ),

              cost:
                Number(
                  values.cost
                )

            }

          }
        );

    }


    /* STOCK TRANSACTION */

    if (
      type === "stock"
    ) {

      result =
        await api(
          "stockTransaction",
          {

            user:
              state.user,

            type:
              values.type,

            itemId:
              values.itemId,

            quantity:
              Number(
                values.quantity
              ),

            supplier:
              values.supplier,

            reason:
              values.reason

          }
        );

    }


    /* ADD SUPPLIER */

    if (
      type === "supplier"
    ) {

      result =
        await api(
          "addSupplier",
          {

            user:
              state.user,

            supplier: {

              name:
                values.name,

              contact:
                values.contact,

              phone:
                values.phone,

              email:
                values.email,

              category:
                values.category

            }

          }
        );

    }


    closeModal();

    await refreshData();

    render();


    showToast(
      result.message ||
      "Saved successfully."
    );


  } catch (error) {

    showToast(
      error.message
    );

  }

}


/* =============================================================
   DELETE INVENTORY
   ============================================================= */

async function deleteInventoryItem(
  id
) {

  if (
    state.user.role !== "Admin"
  ) {

    showToast(
      "Admin permission required."
    );

    return;

  }


  const item =
    state.data.inventory.find(
      inventoryItem =>
        String(
          inventoryItem.id
        ) === String(id)
    );


  if (!item) {

    showToast(
      "Inventory item not found."
    );

    return;

  }


  const confirmed =
    window.confirm(
      `Delete "${item.name}"?\n\nThis cannot be undone.`
    );


  if (!confirmed) {
    return;
  }


  try {

    await api(
      "deleteInventory",
      {

        user:
          state.user,

        id

      }
    );


    await refreshData();

    render();


    showToast(
      "Inventory item deleted."
    );


  } catch (error) {

    showToast(
      error.message
    );

  }

}

   INITIALIZATION
   ============================================================= */

(async function () {

  const savedUser =
    getSessionUser();


  if (
    savedUser
  ) {

    state.user =
      savedUser;


    await startApplication();

  }

})();
